# Cloudflare Worker + sua tela (public/) — free, sem dormir
name = "demanda-trello"
main = "src/worker.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Garante que /api/* passa pelo Worker antes dos arquivos estáticos
run_worker_first = ["/api/*"]

[vars]
FORM_SECRET = "2026"
TRELLO_LIST_ID = "6b04dde7590b0cb96af2c5b6"

# Secrets (uma vez):
#   npx wrangler secret put TRELLO_KEY
#   npx wrangler secret put TRELLO_TOKEN
